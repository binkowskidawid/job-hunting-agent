name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Third-party actions are pinned to a commit SHA, not a tag: a tag is mutable, so the code
# that runs here with repository access could be replaced without this file changing.
# Dependabot's github-actions ecosystem bumps the SHA and its version comment together.
# GitHub-published actions (checkout, codeql-action) are immutable and stay on their tags.

# A branch that gets three pushes in a minute should run its checks once, on the last one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    # The deduplication tests assert database behaviour — a UNIQUE constraint and the
    # inserted-versus-updated signal — so they need a real Postgres. Their fixture skips when
    # none is reachable, which is right on a laptop and wrong here: without this service they
    # would pass by not running.
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg18-trixie
        env:
          POSTGRES_USER: job_agent
          POSTGRES_PASSWORD: job_agent
          POSTGRES_DB: job_agent
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U job_agent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.14

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check --output-format=github .

      - name: Format check
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy src tests

      - name: Apply migrations
        env:
          PGPASSWORD: job_agent
        run: |
          for f in migrations/*.sql; do
            psql -h localhost -U job_agent -d job_agent -v ON_ERROR_STOP=1 -f "$f"
          done

      - name: Test
        env:
          TEST_DATABASE_URL: postgresql://job_agent:job_agent@localhost:5432/job_agent
        run: uv run pytest

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.14

      - name: Audit dependencies
        run: uv audit --frozen --preview-features audit-command

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The image is how this project is actually run. Without this job a Dockerfile that
      # no longer builds ships green, and the failure surfaces on someone else's clone.
      - name: Build the app image
        run: docker build --tag job-hunting-agent:ci .
