services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg18-trixie
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      # Postgres 18+ images want the mount at /var/lib/postgresql, not .../data: the
      # entrypoint creates a major-version subdirectory beneath it so pg_upgrade --link
      # works without crossing a mount boundary. Mounting .../data aborts on startup with
      # "there appears to be PostgreSQL data in /var/lib/postgresql/data (unused
      # mount/volume)".
      - postgres_data:/var/lib/postgresql
      - ./migrations:/migrations:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

  ollama:
    image: ollama/ollama:0.32.5
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "127.0.0.1:11434:11434"

  app:
    build: .
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_started
    restart: unless-stopped

volumes:
  postgres_data:
  ollama_data:
