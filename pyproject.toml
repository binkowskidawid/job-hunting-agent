[project]
name = "job-hunting-app"
version = "0.1.0"
description = "A CV-based job offer monitoring agent that learns from your feedback."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "anthropic>=0.120.2",
    "apscheduler>=3.11.3",
    "discord-py>=2.7.1",
    "httpx>=0.28.1",
    "imap-tools>=1.14.0",
    "numpy>=2.5.1",
    "ollama>=0.6.2",
    "psycopg[binary]>=3.3.4",
    "pydantic>=2.13.4",
]

[project.optional-dependencies]
ml = ["scikit-learn", "numpy"]
extension = [
    "fastapi>=0.141.1",
    "langgraph",
    "langgraph-checkpoint-postgres",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.14"
strict = true
disallow_untyped_defs = true
mypy_path = "src"

[[tool.mypy.overrides]]
# APScheduler 3.x ships no inline types and no stub package exists on PyPI (verified 2026-08-04).
module = "apscheduler.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pre-commit>=4.6.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.1",
]
