[project]
name = "job-hunting-agent"
version = "0.1.0"
description = "A CV-based job offer monitoring agent that learns from your feedback."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "anthropic>=0.120.2",
    "apscheduler>=3.11.3",
    "discord-py>=2.7.1",
    "httpx>=0.28.1",
    "numpy>=2.5.1",
    "ollama>=0.6.2",
    "psycopg[binary,pool]>=3.3.4",
    "pydantic>=2.13.4",
    "pyyaml>=6.0.3",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests"]
# Ruff formats Python blocks inside Markdown, and docs/ holds local working notes whose
# code samples are quoted material, not project source. Excluded explicitly rather than
# relying on .gitignore, which ruff only honours inside a git work tree.
extend-exclude = ["docs"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "F",      # pyflakes
    "I",      # import sorting
    "UP",     # pyupgrade
    "B",      # bugbear
    "SIM",    # simplify
    "RUF",    # ruff-specific
    "ASYNC",  # blocking calls inside async def — this codebase is async end to end
    "S",      # bandit; S506 is what keeps yaml.load out of the config loaders
    "PTH",    # prefer pathlib over os.path
]

[tool.ruff.lint.per-file-ignores]
# pytest is built on assert statements, and fixture credentials read to bandit as
# hardcoded secrets.
"tests/*" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.14"
strict = true
disallow_untyped_defs = true
mypy_path = "src"

[[tool.mypy.overrides]]
# APScheduler 3.x ships no inline types and no stub package exists on PyPI (verified 2026-08-04).
module = "apscheduler.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pre-commit>=4.6.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.1",
    "types-pyyaml>=6.0.12.20260815",
]
